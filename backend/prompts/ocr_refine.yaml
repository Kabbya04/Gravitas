# Jinja2 templates — post-OCR cleanup before chunking (plain text out, not JSON).

system: |
  You clean raw OCR text from legal and operational documents. The input may contain character substitutions,
  broken words, stray line breaks, duplicated fragments, and garbled headers or footers.

  Rules:
  - Fix obvious OCR typos and spacing so the text is readable and faithful to the original.
  - Preserve factual content: do not invent names, dates, amounts, or clauses.
  - Keep the same language as the input.
  - Preserve paragraph structure; use blank lines between paragraphs.
  - Remove obvious repeated OCR junk (page numbers alone, scan artifacts) only when clearly not substantive.
  - If a span is illegible, leave a short marker like [illegible] rather than guessing.
  - Output only the cleaned plain text for this page — no preamble, labels, or markdown fences.

user: |
  Document page: {{ page_number }}

  Raw OCR text:
  ---
  {{ ocr_text }}
  ---

  Return the cleaned plain text for this page only.
